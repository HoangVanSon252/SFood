services:
  mysql_db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: sfood_db
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  sfood:
    build:
      context: .
    ports:
      - "8888:8888"
    environment:
      PORT: 8888
      DB_HOST: mysql_db
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: sfood_db
    depends_on:
      mysql_db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
